[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trust-rag"
version = "0.1.0"
description = "Evidence-aware Agentic RAG system built with LangChain and LangGraph"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "TrustRAG Contributors" }
]
keywords = [
    "rag",
    "agentic-rag",
    "langgraph",
    "langchain",
    "llm",
    "evidence",
    "trustworthy-ai"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "fastapi>=0.110,<0.136",
    "starlette<1.0",
    "anyio<4.13",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
    "langchain-core>=0.2",
    "langgraph>=0.2",
    "python-multipart>=0.0.9",
    "pyyaml>=6.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27,<0.29",
    "ruff>=0.4",
    "mypy>=1.10",
]
qdrant = [
    "qdrant-client>=1.7",
]
production = [
    "alembic>=1.13,<2",
    "boto3>=1.34,<2",
    "psycopg[binary]>=3.1,<4",
    "pyjwt[crypto]>=2.8,<3",
    "qdrant-client>=1.7",
    "sqlalchemy>=2.0,<2.1",
    "opentelemetry-exporter-otlp-proto-http>=1.25,<2",
    "opentelemetry-sdk>=1.25,<2",
]
embeddings = [
    "sentence-transformers>=3.0",
]
reranker = [
    "sentence-transformers>=3.0",
]

[project.urls]
Homepage = "https://github.com/yourname/trust-rag"
Documentation = "https://github.com/yourname/trust-rag/tree/main/docs"
Issues = "https://github.com/yourname/trust-rag/issues"

[project.scripts]
trustrag-import-legacy = "backend.app.persistence.import_legacy:main"
trustrag-index-worker = "backend.app.indexing.worker:main"
trustrag-verify-production = "backend.app.operations.verify_production:main"
trustrag-wiki = "backend.app.wiki.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
python_files = ["test_*.py"]
addopts = "-ra -q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
