# deploy/docker-compose.dev.yml
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: trustrag
      POSTGRES_PASSWORD: trustrag
      POSTGRES_DB: trustrag
    ports: ["5432:5432"]
    volumes: ["trustrag_pg:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: ["trustrag_qdrant:/qdrant/storage"]
volumes:
  trustrag_pg:
  trustrag_qdrant:
